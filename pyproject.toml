[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "kidneyloop"
version = "0.1.0"
description = "Kidney paired-donation cycles and chains in a Relate graph, with the path behind every match."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
dependencies = [
    "relate-db==1.1.0",
    "typer>=0.12",
    "pulp>=2.8",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
kx = "kidneyloop.cli:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
